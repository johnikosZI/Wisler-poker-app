<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisler Takes All | Poker Buy-In Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1c2420;
            min-height: 100vh;
            color: #e8e4dc;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #3d4a44;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2em;
            color: #e8e4dc;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .tagline {
            color: #7a8580;
            margin-top: 8px;
            font-size: 0.95em;
        }

        .card-suits {
            font-size: 1.2em;
            margin-top: 8px;
            color: #5a6660;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #242e29;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 600;
            color: #e8e4dc;
        }

        .stat-label {
            font-size: 0.8em;
            color: #7a8580;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-player-section {
            background: #242e29;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .add-player-section h2 {
            color: #e8e4dc;
            margin-bottom: 15px;
            font-size: 1.1em;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 150px;
            padding: 12px 15px;
            border: 1px solid #3d4a44;
            border-radius: 6px;
            background: #1c2420;
            color: #e8e4dc;
            font-size: 1em;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #5a6660;
        }

        input::placeholder {
            color: #5a6660;
        }

        button {
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #3d4a44;
            border-color: #4d5a54;
            color: #e8e4dc;
        }

        .btn-primary:hover {
            background: #4d5a54;
            border-color: #5d6a64;
        }

        .btn-secondary {
            background: #2a3530;
            color: #a8b0ac;
            border-color: #4d5a54;
            padding: 10px 16px;
            font-size: 0.9em;
        }

        .btn-secondary:hover {
            background: #3a4540;
            color: #e8e4dc;
            border-color: #5d6a64;
        }

        .btn-danger {
            background: #4a2c2c;
            border-color: #6a4040;
            color: #e8a0a0;
            padding: 10px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #5a3535;
            border-color: #7a5050;
        }

        .players-section h2 {
            color: #e8e4dc;
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 500;
        }

        .player-card {
            background: #242e29;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .player-card:hover {
            background: #2a3530;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .player-name {
            font-size: 1.2em;
            font-weight: 500;
            color: #e8e4dc;
        }

        .player-total {
            font-size: 1.4em;
            color: #7a8580;
            font-weight: 500;
        }

        .buy-ins-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .buy-in-chip {
            background: #1c2420;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.85em;
            color: #7a8580;
        }

        .buy-in-chip.prepaid {
            background: #1e3025;
            color: #7cb97c;
        }

        .player-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .no-players {
            text-align: center;
            padding: 40px;
            color: #5a6660;
        }

        .no-players .icon {
            font-size: 2.5em;
            margin-bottom: 12px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #5a6660;
            border-top: 1px solid #3d4a44;
            margin-top: 40px;
            font-size: 0.9em;
        }

        footer .quote {
            margin-bottom: 8px;
        }

        .cashout-input {
            width: 100px;
        }

        .btn-cashout {
            background: #1e3025;
            border-color: #3a5a40;
            color: #90d090;
            padding: 10px 16px;
            font-size: 0.9em;
        }

        .btn-cashout:hover {
            background: #2a4030;
            border-color: #4a6a50;
        }

        .cashed-out {
            background: #1e2825 !important;
        }

        .cashout-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .cashout-winner {
            background: #1e3025;
            color: #7cb97c;
        }

        .cashout-loser {
            background: #3a2525;
            color: #c97c7c;
        }

        .cashout-even {
            background: #2a2e2c;
            color: #7a8580;
        }

        .settlement-section {
            background: #242e29;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
        }

        .settlement-section.active {
            display: block;
        }

        .settlement-section h2 {
            color: #e8e4dc;
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 500;
        }

        .settlement-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #1c2420;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .settlement-item .payer {
            color: #c97c7c;
            font-weight: 500;
        }

        .settlement-item .payee {
            color: #7cb97c;
            font-weight: 500;
        }

        .settlement-item .amount {
            color: #e8e4dc;
            font-weight: 600;
            font-size: 1.1em;
        }

        .settlement-arrow {
            color: #5a6660;
            margin: 0 8px;
        }

        .btn-end-game {
            background: #4a2c2c;
            color: #e8e4dc;
            width: 100%;
            margin-top: 16px;
        }

        .btn-end-game:hover {
            background: #5a3535;
        }

        .btn-reset {
            background: #2a3530;
            color: #7a8580;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #3a4540;
            color: #e8e4dc;
        }

        .all-cashed-message {
            text-align: center;
            color: #7cb97c;
            padding: 15px;
        }

        /* Chip Calculator Styles */
        .chip-calculator {
            background: #242e29;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .chip-calculator h2 {
            color: #e8e4dc;
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 500;
        }

        .chip-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .chip-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .chip-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7em;
            border: 3px dashed rgba(0,0,0,0.2);
        }

        .chip-white {
            background: #e8e4dc;
            color: #333;
        }

        .chip-red {
            background: #c44;
            color: #fff;
        }

        .chip-blue {
            background: #3677b5;
            color: #fff;
        }

        .chip-green {
            background: #3a7a4a;
            color: #fff;
        }

        .chip-black {
            background: #333;
            color: #fff;
        }

        .chip-item input {
            width: 56px;
            text-align: center;
            padding: 8px;
            min-width: unset;
            flex: unset;
        }

        .chip-item .chip-value {
            font-size: 0.75em;
            color: #5a6660;
        }

        .calc-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1c2420;
            border-radius: 6px;
        }

        .calc-total-label {
            color: #7a8580;
        }

        .calc-total-value {
            font-size: 1.8em;
            font-weight: 600;
            color: #e8e4dc;
        }

        .calc-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .calc-actions button {
            flex: 1;
        }

        .settlement-breakdown {
            margin-bottom: 16px;
        }

        .settlement-breakdown h3 {
            color: #7a8580;
            margin-bottom: 10px;
            font-size: 0.9em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1c2420;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9em;
        }

        .breakdown-item .name {
            color: #e8e4dc;
        }

        .breakdown-item .details {
            color: #5a6660;
        }

        .breakdown-item .net {
            font-weight: 500;
        }

        .breakdown-item .net.owes {
            color: #c97c7c;
        }

        .breakdown-item .net.owed {
            color: #7cb97c;
        }

        .breakdown-item .net.even {
            color: #7a8580;
        }

        .settlement-divider {
            border-top: 1px solid #3d4a44;
            margin: 16px 0;
        }

        .settlement-section h3 {
            color: #7a8580;
            margin-bottom: 12px;
            font-size: 0.9em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* History Section */
        .history-section {
            background: #242e29;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .history-section h2 {
            color: #e8e4dc;
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-toggle {
            background: #2a3530;
            color: #a8b0ac;
            border: 2px solid #4d5a54;
            padding: 8px 14px;
            font-size: 0.8em;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .history-toggle:hover {
            background: #3a4540;
            color: #e8e4dc;
            border-color: #5d6a64;
        }

        .history-list {
            display: none;
        }

        .history-list.active {
            display: block;
        }

        .history-game {
            background: #1c2420;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .history-game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3d4a44;
        }

        .history-game-date {
            color: #e8e4dc;
            font-weight: 500;
        }

        .history-game-players {
            color: #5a6660;
            font-size: 0.85em;
        }

        .history-results {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-player {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .history-player.winner {
            background: #1e3025;
            color: #7cb97c;
        }

        .history-player.loser {
            background: #3a2525;
            color: #c97c7c;
        }

        .history-player.even {
            color: #5a6660;
        }

        .no-history {
            text-align: center;
            color: #5a6660;
            padding: 20px;
        }

        .btn-clear-history {
            background: #2a3530;
            color: #7a8580;
            border: 2px solid #3d4a44;
            font-size: 0.8em;
            padding: 8px 14px;
            font-weight: 600;
        }

        .btn-clear-history:hover {
            background: #4a2c2c;
            color: #e8a0a0;
            border-color: #6a4040;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            header {
                padding: 20px 0;
            }

            h1 {
                font-size: 1.6em;
            }

            .tagline {
                font-size: 0.9em;
            }

            .stats-bar {
                gap: 20px;
                padding: 16px;
            }

            .stat-value {
                font-size: 1.8em;
            }

            .add-player-section {
                padding: 16px;
            }

            .input-row {
                flex-direction: column;
            }

            input {
                min-width: 100%;
                padding: 14px;
                font-size: 16px;
            }

            button {
                padding: 14px 20px;
                width: 100%;
            }

            .player-card {
                padding: 14px;
            }

            .player-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .player-name {
                font-size: 1.1em;
            }

            .player-total {
                font-size: 1.2em;
            }

            .player-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .player-actions input {
                grid-column: 1 / -1;
            }

            .cashout-input {
                width: 100% !important;
            }

            .btn-cashout {
                width: 100%;
                padding: 12px;
            }

            .settlement-section {
                padding: 16px;
            }

            .settlement-item {
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
                gap: 4px;
            }

            .settlement-item .payer,
            .settlement-item .payee {
                width: 100%;
            }

            .settlement-item .amount {
                font-size: 1.2em;
                margin: 4px 0;
            }

            .settlement-arrow {
                display: none;
            }

            footer {
                padding: 20px 12px;
            }

            .chip-calculator {
                padding: 16px;
            }

            .chip-grid {
                gap: 6px;
            }

            .chip-circle {
                width: 40px;
                height: 40px;
                font-size: 0.6em;
            }

            .chip-item input {
                width: 48px;
                padding: 6px;
                font-size: 14px;
            }

            .chip-item .chip-value {
                font-size: 0.65em;
            }

            .calc-total-value {
                font-size: 1.5em;
            }

            .calc-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.4em;
            }

            .stat-value {
                font-size: 1.5em;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            button {
                min-height: 48px;
            }

            input {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WISLER TAKES ALL</h1>
            <p class="tagline">Poker night tracker</p>
            <div class="card-suits">♠ ♥ ♣ ♦</div>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalPot">$0</div>
                <div class="stat-label">The Pot</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="playerCount">0</div>
                <div class="stat-label">Players</div>
            </div>
        </div>

        <div class="add-player-section">
            <h2>Add Player</h2>
            <div class="input-row">
                <input type="text" id="playerName" placeholder="Player Name" onkeypress="handleKeyPress(event)">
                <button class="btn-primary" onclick="addPlayer(false)">$25 Buy-In</button>
                <button class="btn-cashout" onclick="addPlayer(true)">$25 Pre-Paid</button>
            </div>
        </div>

        <div class="chip-calculator">
            <h2>Chip Counter</h2>
            <div class="chip-grid">
                <div class="chip-item">
                    <div class="chip-circle chip-white">10¢</div>
                    <input type="number" id="chip-white" placeholder="0" min="0" oninput="calculateChips()">
                    <span class="chip-value">White</span>
                </div>
                <div class="chip-item">
                    <div class="chip-circle chip-red">50¢</div>
                    <input type="number" id="chip-red" placeholder="0" min="0" oninput="calculateChips()">
                    <span class="chip-value">Red</span>
                </div>
                <div class="chip-item">
                    <div class="chip-circle chip-blue">$1</div>
                    <input type="number" id="chip-blue" placeholder="0" min="0" oninput="calculateChips()">
                    <span class="chip-value">Blue</span>
                </div>
                <div class="chip-item">
                    <div class="chip-circle chip-green">$2</div>
                    <input type="number" id="chip-green" placeholder="0" min="0" oninput="calculateChips()">
                    <span class="chip-value">Green</span>
                </div>
                <div class="chip-item">
                    <div class="chip-circle chip-black">$5</div>
                    <input type="number" id="chip-black" placeholder="0" min="0" oninput="calculateChips()">
                    <span class="chip-value">Black</span>
                </div>
            </div>
            <div class="calc-total">
                <span class="calc-total-label">Total Value</span>
                <span class="calc-total-value" id="chipTotal">$0.00</span>
            </div>
            <div class="calc-actions">
                <button class="btn-secondary" onclick="clearChips()">Clear</button>
                <button class="btn-primary" onclick="copyChipTotal()">Copy Total</button>
            </div>
        </div>

        <div class="players-section">
            <h2>Players</h2>
            <div id="playersList">
                <div class="no-players">
                    <div class="icon">🎰</div>
                    <p>No players yet. Who's got the guts to sit at Wisler's table?</p>
                </div>
            </div>
            <button class="btn-primary btn-end-game" id="endGameBtn" onclick="showSettlement()" style="display: none;">
                End Game & Calculate Payouts
            </button>
        </div>

        <div class="settlement-section" id="settlementSection">
            <h2>Settlement</h2>
            <div id="settlementList"></div>
            <button class="btn-primary btn-reset" onclick="saveAndStartNewGame()">Save & Start New Game</button>
        </div>

        <div class="history-section">
            <h2>
                Game History
                <button class="history-toggle" onclick="toggleHistory()">Show/Hide</button>
            </h2>
            <div class="history-list" id="historyList">
                <div class="no-history">No saved games yet.</div>
            </div>
        </div>

        <footer>
            <p>Wisler Poker Night</p>
        </footer>
    </div>

    <script>
        let players = [];
        let gameHistory = [];

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        const BUY_IN_AMOUNT = 25;

        // Chip values in cents
        const CHIP_VALUES = {
            white: 10,
            red: 50,
            blue: 100,
            green: 200,
            black: 500
        };

        function calculateChips() {
            let totalCents = 0;
            for (const [color, value] of Object.entries(CHIP_VALUES)) {
                const count = parseInt(document.getElementById(`chip-${color}`).value) || 0;
                totalCents += count * value;
            }
            const totalDollars = totalCents / 100;
            document.getElementById('chipTotal').textContent = `$${totalDollars.toFixed(2)}`;
        }

        function clearChips() {
            for (const color of Object.keys(CHIP_VALUES)) {
                document.getElementById(`chip-${color}`).value = '';
            }
            calculateChips();
        }

        function copyChipTotal() {
            const total = document.getElementById('chipTotal').textContent;
            navigator.clipboard.writeText(total).then(() => {
                alert(`Copied ${total} to clipboard!`);
            }).catch(() => {
                alert(`Total: ${total}`);
            });
        }

        function addPlayer(isPrepaid = false) {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();

            if (!name) {
                alert('Enter a player name, friend.');
                return;
            }

            const prepaidText = isPrepaid ? ' (pre-paid)' : '';
            if (!confirm(`Add ${name} with a $${BUY_IN_AMOUNT} buy-in${prepaidText}?`)) {
                return;
            }

            players.push({
                id: generateId(),
                name: name,
                buyIns: [BUY_IN_AMOUNT],
                prepaid: isPrepaid ? BUY_IN_AMOUNT : 0,
                finalChips: null,
                cashedOut: false
            });

            nameInput.value = '';
            nameInput.focus();

            renderPlayers();
            updateStats();
            saveToLocalStorage();
        }

        function addRebuy(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player || player.cashedOut) return;

            if (!confirm(`Add $${BUY_IN_AMOUNT} rebuy for ${player.name}?`)) {
                return;
            }

            player.buyIns.push(BUY_IN_AMOUNT);
            renderPlayers();
            updateStats();
            saveToLocalStorage();
        }

        function addPrepaid(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player || player.cashedOut) return;

            if (!confirm(`Add $${BUY_IN_AMOUNT} pre-paid for ${player.name}?`)) {
                return;
            }

            player.prepaid = (player.prepaid || 0) + BUY_IN_AMOUNT;
            renderPlayers();
            updateStats();
            saveToLocalStorage();
        }

        function cashOut(playerId) {
            const input = document.getElementById(`cashout-${playerId}`);
            const amount = parseFloat(input.value);

            if (isNaN(amount) || amount < 0) {
                alert('Enter a valid chip count (0 or more).');
                return;
            }

            const player = players.find(p => p.id === playerId);
            if (player) {
                player.finalChips = amount;
                player.cashedOut = true;
                renderPlayers();
                updateStats();
                saveToLocalStorage();
            }
        }

        function undoCashOut(playerId) {
            const player = players.find(p => p.id === playerId);
            if (player) {
                player.finalChips = null;
                player.cashedOut = false;
                renderPlayers();
                updateStats();
                saveToLocalStorage();
            }
        }

        function removePlayer(playerId) {
            const player = players.find(p => p.id === playerId);
            if (player && confirm(`Remove ${player.name} from the table?`)) {
                players = players.filter(p => p.id !== playerId);
                renderPlayers();
                updateStats();
                saveToLocalStorage();
            }
        }

        function getPlayerTotal(player) {
            return player.buyIns.reduce((sum, amount) => sum + amount, 0);
        }

        function getPlayerProfit(player) {
            if (player.finalChips === null) return null;
            return player.finalChips - getPlayerTotal(player);
        }

        function renderPlayers() {
            const container = document.getElementById('playersList');
            const endGameBtn = document.getElementById('endGameBtn');

            if (players.length === 0) {
                container.innerHTML = `
                    <div class="no-players">
                        <p>No players yet</p>
                    </div>
                `;
                endGameBtn.style.display = 'none';
                return;
            }

            // Show end game button if there are players
            endGameBtn.style.display = 'block';

            // Check if all players have cashed out
            const allCashedOut = players.every(p => p.cashedOut);
            if (allCashedOut) {
                endGameBtn.textContent = 'Show Final Settlement';
            } else {
                const cashedOutCount = players.filter(p => p.cashedOut).length;
                endGameBtn.textContent = `End Game & Calculate Payouts (${cashedOutCount}/${players.length} cashed out)`;
            }

            container.innerHTML = players.map(player => {
                const total = getPlayerTotal(player);
                const prepaid = player.prepaid || 0;
                let buyInsDisplay = player.buyIns.map((amount, index) =>
                    `<span class="buy-in-chip">${index === 0 ? 'Initial' : 'Rebuy'}: $${amount.toFixed(2)}</span>`
                ).join('');
                if (prepaid > 0) {
                    buyInsDisplay += `<span class="buy-in-chip prepaid">Pre-Paid: $${prepaid.toFixed(2)}</span>`;
                }

                let cashoutSection = '';
                if (player.cashedOut) {
                    const profit = getPlayerProfit(player);
                    let resultClass = 'cashout-even';
                    let resultText = 'Broke even';
                    if (profit > 0) {
                        resultClass = 'cashout-winner';
                        resultText = `Won $${profit.toFixed(2)}`;
                    } else if (profit < 0) {
                        resultClass = 'cashout-loser';
                        resultText = `Owes $${Math.abs(profit).toFixed(2)}`;
                    }
                    cashoutSection = `
                        <div class="cashout-result ${resultClass}">
                            Cashed out: $${player.finalChips.toFixed(2)} — ${resultText}
                        </div>
                        <div class="player-actions" style="margin-top: 10px;">
                            <button class="btn-secondary" onclick="undoCashOut('${player.id}')">Undo Cash Out</button>
                        </div>
                    `;
                } else {
                    cashoutSection = `
                        <div class="player-actions">
                            <button class="btn-secondary" onclick="addRebuy('${player.id}')">+$${BUY_IN_AMOUNT} Rebuy</button>
                            <button class="btn-cashout" onclick="addPrepaid('${player.id}')">+$${BUY_IN_AMOUNT} Pre-Paid</button>
                            <button class="btn-danger" onclick="removePlayer('${player.id}')">Remove</button>
                        </div>
                        <div class="player-actions" style="margin-top: 10px;">
                            <input type="number" id="cashout-${player.id}" class="cashout-input" placeholder="Final chips $" onkeypress="handleCashoutKeyPress(event, '${player.id}')">
                            <button class="btn-cashout" onclick="cashOut('${player.id}')">Cash Out</button>
                        </div>
                    `;
                }

                return `
                    <div class="player-card ${player.cashedOut ? 'cashed-out' : ''}">
                        <div class="player-header">
                            <span class="player-name">${player.name}</span>
                            <span class="player-total">$${total.toFixed(2)} in</span>
                        </div>
                        <div class="buy-ins-list">
                            ${buyInsDisplay}
                        </div>
                        ${cashoutSection}
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const totalPot = players.reduce((sum, player) => sum + getPlayerTotal(player), 0);
            document.getElementById('totalPot').textContent = `$${totalPot.toFixed(2)}`;
            document.getElementById('playerCount').textContent = players.length;
        }

        function showSettlement() {
            const notCashedOut = players.filter(p => !p.cashedOut);
            if (notCashedOut.length > 0) {
                const names = notCashedOut.map(p => p.name).join(', ');
                alert(`These players haven't cashed out yet: ${names}\n\nEnter their final chip counts first.`);
                return;
            }

            calculateSettlement();
            document.getElementById('settlementSection').classList.add('active');
            document.getElementById('settlementSection').scrollIntoView({ behavior: 'smooth' });
        }

        function calculateSettlement() {
            const container = document.getElementById('settlementList');

            // Calculate totals for summary
            let totalOwed = 0;
            let totalGets = 0;
            let totalPrepaid = 0;

            // Build breakdown for each player
            let breakdownHtml = players.map(player => {
                const buyIn = getPlayerTotal(player);
                const finalChips = player.finalChips;
                const profit = getPlayerProfit(player);
                const prepaid = player.prepaid || 0;
                const netPosition = profit + prepaid;
                totalPrepaid += prepaid;

                let netClass = 'even';
                let netText = 'Square';
                if (netPosition < -0.01) {
                    netClass = 'owes';
                    netText = `Owes $${Math.abs(netPosition).toFixed(2)}`;
                    totalOwed += Math.abs(netPosition);
                } else if (netPosition > 0.01) {
                    netClass = 'owed';
                    netText = `Gets $${netPosition.toFixed(2)}`;
                    totalGets += netPosition;
                }

                const prepaidNote = prepaid > 0 ? `, Pre-paid: $${prepaid.toFixed(2)}` : '';

                return `
                    <div class="breakdown-item">
                        <span class="name">${player.name}</span>
                        <span class="details">In: $${buyIn.toFixed(2)}, Out: $${finalChips.toFixed(2)}${prepaidNote}</span>
                        <span class="net ${netClass}">${netText}</span>
                    </div>
                `;
            }).join('');

            // Add bank row if there's prepaid money
            if (totalPrepaid > 0.01) {
                breakdownHtml += `
                    <div class="breakdown-item" style="border: 1px solid #3d4a44; margin-top: 10px;">
                        <span class="name">Bank (You)</span>
                        <span class="details">Holding pre-paid money</span>
                        <span class="net owes">Pays $${totalPrepaid.toFixed(2)}</span>
                    </div>
                `;
            }

            // Add net total row
            const netBalance = (totalOwed + totalPrepaid - totalGets);
            breakdownHtml += `
                <div class="breakdown-item" style="border-top: 1px solid #3d4a44; margin-top: 10px; padding-top: 12px;">
                    <span class="name"><strong>Net Balance</strong></span>
                    <span class="details">Owes: $${totalOwed.toFixed(2)} + Bank: $${totalPrepaid.toFixed(2)} = Gets: $${totalGets.toFixed(2)}</span>
                    <span class="net ${Math.abs(netBalance) < 0.01 ? 'owed' : 'owes'}">${Math.abs(netBalance) < 0.01 ? 'Balanced' : `Off by $${netBalance.toFixed(2)}`}</span>
                </div>
            `;

            // Calculate who owes and who is owed
            const losers = []; // People who owe money (after accounting for their prepaid)
            const winners = []; // People who are owed money

            players.forEach(player => {
                const profit = getPlayerProfit(player);
                const prepaid = player.prepaid || 0;

                // Net position: what this player actually owes/gets after prepaid
                const netPosition = profit + prepaid;

                if (netPosition < -0.01) {
                    losers.push({ name: player.name, amount: Math.abs(netPosition) });
                } else if (netPosition > 0.01) {
                    winners.push({ name: player.name, amount: netPosition });
                }
            });

            // Add the bank (host) as a payer for prepaid amounts
            // This represents the prepaid money you're holding that needs to go to winners
            if (totalPrepaid > 0.01) {
                losers.push({ name: 'Bank (Pre-Paid)', amount: totalPrepaid });
            }

            // Sort by amount (highest first)
            losers.sort((a, b) => b.amount - a.amount);
            winners.sort((a, b) => b.amount - a.amount);

            // Calculate simplified payments
            const payments = [];
            let loserIndex = 0;
            let winnerIndex = 0;
            let loserRemaining = losers.length > 0 ? losers[0].amount : 0;
            let winnerRemaining = winners.length > 0 ? winners[0].amount : 0;

            while (loserIndex < losers.length && winnerIndex < winners.length) {
                const payAmount = Math.min(loserRemaining, winnerRemaining);

                if (payAmount > 0.01) { // Ignore tiny amounts due to floating point
                    payments.push({
                        from: losers[loserIndex].name,
                        to: winners[winnerIndex].name,
                        amount: payAmount
                    });
                }

                loserRemaining -= payAmount;
                winnerRemaining -= payAmount;

                if (loserRemaining < 0.01) {
                    loserIndex++;
                    loserRemaining = loserIndex < losers.length ? losers[loserIndex].amount : 0;
                }
                if (winnerRemaining < 0.01) {
                    winnerIndex++;
                    winnerRemaining = winnerIndex < winners.length ? winners[winnerIndex].amount : 0;
                }
            }

            let paymentsHtml = '';
            if (payments.length === 0) {
                paymentsHtml = `
                    <div class="all-cashed-message">
                        Everyone broke even! No payments needed.
                    </div>
                `;
            } else {
                paymentsHtml = payments.map(payment => `
                    <div class="settlement-item">
                        <span class="payer">${payment.from}</span>
                        <span class="settlement-arrow">pays →</span>
                        <span class="amount">$${payment.amount.toFixed(2)}</span>
                        <span class="settlement-arrow">→</span>
                        <span class="payee">${payment.to}</span>
                    </div>
                `).join('');
            }

            container.innerHTML = `
                <div class="settlement-breakdown">
                    <h3>Player Summary</h3>
                    ${breakdownHtml}
                </div>
                <div class="settlement-divider"></div>
                <h3>Payments</h3>
                ${paymentsHtml}
            `;
        }

        function resetGame() {
            if (confirm('Start a new game? This will clear all player data.')) {
                players = [];
                localStorage.removeItem('wislerPokerPlayers');
                document.getElementById('settlementSection').classList.remove('active');
                renderPlayers();
                updateStats();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addPlayer();
            }
        }

        function handleCashoutKeyPress(event, playerId) {
            if (event.key === 'Enter') {
                cashOut(playerId);
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('wislerPokerPlayers', JSON.stringify(players));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('wislerPokerPlayers');
            if (saved) {
                players = JSON.parse(saved);
                renderPlayers();
                updateStats();

                // Check if game was in settlement state
                const allCashedOut = players.length > 0 && players.every(p => p.cashedOut);
                if (allCashedOut) {
                    calculateSettlement();
                    document.getElementById('settlementSection').classList.add('active');
                }
            }
        }

        function saveAndStartNewGame() {
            if (players.length === 0) {
                alert('No game to save.');
                return;
            }

            // Check if all players cashed out for a complete game
            const allCashedOut = players.every(p => p.cashedOut);
            if (!allCashedOut) {
                if (!confirm('Not all players have cashed out. Save incomplete game anyway?')) {
                    return;
                }
            }

            // Create a game record
            const gameRecord = {
                id: generateId(),
                date: new Date().toISOString(),
                players: players.map(p => ({
                    name: p.name,
                    buyIns: [...p.buyIns],
                    prepaid: p.prepaid || 0,
                    finalChips: p.finalChips,
                    cashedOut: p.cashedOut
                })),
                totalPot: players.reduce((sum, p) => sum + getPlayerTotal(p), 0)
            };

            // Add to history
            gameHistory.unshift(gameRecord);
            saveHistoryToLocalStorage();

            // Reset current game
            players = [];
            localStorage.removeItem('wislerPokerPlayers');
            document.getElementById('settlementSection').classList.remove('active');
            renderPlayers();
            updateStats();
            renderHistory();

            alert('Game saved! Starting fresh.');
        }

        function toggleHistory() {
            const historyList = document.getElementById('historyList');
            historyList.classList.toggle('active');
        }

        function renderHistory() {
            const container = document.getElementById('historyList');

            if (gameHistory.length === 0) {
                container.innerHTML = '<div class="no-history">No saved games yet.</div>';
                return;
            }

            container.innerHTML = gameHistory.map(game => {
                const date = new Date(game.date);
                const dateStr = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit'
                });

                // Get all player results
                const results = game.players
                    .filter(p => p.cashedOut)
                    .map(p => {
                        const total = p.buyIns.reduce((sum, b) => sum + b, 0);
                        return { name: p.name, profit: p.finalChips - total };
                    })
                    .sort((a, b) => b.profit - a.profit);

                let resultsHtml = '';
                if (results.length > 0) {
                    resultsHtml = results.map(r => {
                        if (r.profit > 0) {
                            return `<div class="history-player winner">${r.name} <span>+$${r.profit.toFixed(2)}</span></div>`;
                        } else if (r.profit < 0) {
                            return `<div class="history-player loser">${r.name} <span>-$${Math.abs(r.profit).toFixed(2)}</span></div>`;
                        } else {
                            return `<div class="history-player even">${r.name} <span>$0.00</span></div>`;
                        }
                    }).join('');
                } else {
                    resultsHtml = '<div class="history-player"><em>Incomplete game</em></div>';
                }

                return `
                    <div class="history-game">
                        <div class="history-game-header">
                            <span class="history-game-date">${dateStr}</span>
                            <span class="history-game-players">${game.players.length} players | $${game.totalPot.toFixed(2)} pot</span>
                        </div>
                        <div class="history-results">${resultsHtml}</div>
                    </div>
                `;
            }).join('') + `
                <button class="btn-clear-history" onclick="clearHistory()">Clear All History</button>
            `;
        }

        function clearHistory() {
            if (confirm('Clear all game history? This cannot be undone.')) {
                gameHistory = [];
                saveHistoryToLocalStorage();
                renderHistory();
            }
        }

        function saveHistoryToLocalStorage() {
            localStorage.setItem('wislerPokerHistory', JSON.stringify(gameHistory));
        }

        function loadHistoryFromLocalStorage() {
            const saved = localStorage.getItem('wislerPokerHistory');
            if (saved) {
                gameHistory = JSON.parse(saved);
                renderHistory();
            }
        }

        // Load saved data on page load
        loadFromLocalStorage();
        loadHistoryFromLocalStorage();
    </script>
</body>
</html>
